openapi: 3.1.0
info:
  title: CRM API (lead capture, assignment, tasks, notifications)
  version: 0.1.0
  description: |
    Huzaifa's part of the shared /api/v1 contract. To be merged into the shared
    OpenAPI file once Taimoor's lands.

    **Auth:** `Authorization: Bearer <Supabase access token>` and
    `X-Workspace-Id: <uuid>` on every endpoint except `/hooks/*` (public,
    signed), `/billing/*` (`X-Partner-Id` for partner admins, or
    `X-Workspace-Id` for a direct customer's owner) and `/admin/*`
    (super-admins).
    Agents only ever see their own leads and tasks (enforced by RLS).

    **Errors:** `{ "error": { "code", "message", "details"? } }`.
    Common codes: `unauthorized` 401, `not_a_member` / `forbidden` /
    `workspace_read_only` / `workspace_suspended` 403, `not_found` 404, `conflict` 409,
    `validation_failed` 422 (details: [{path, message}]), `rate_limited` 429.

    **Lists** are cursor-paginated: pass `next_cursor` back as `cursor`.
    **Times** are ISO 8601 UTC; "today" means the workspace's timezone.
servers:
  - url: /api/v1
security:
  - bearer: []
tags:
  - name: Lead capture
  - name: Assignment
  - name: Tasks
  - name: Notifications
  - name: Home
  - name: Automations
  - name: Reports
  - name: Billing
  - name: Admin

paths:
  /lead-sources:
    get:
      tags: [Lead capture]
      summary: List lead sources (managers)
      parameters: [{ $ref: '#/components/parameters/Workspace' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/LeadSource' } }
    post:
      tags: [Lead capture]
      summary: Create a lead source (managers)
      description: For `webhook` sources the response includes `secret`. It is shown only here and on rotation.
      parameters: [{ $ref: '#/components/parameters/Workspace' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, name]
              properties:
                type: { type: string, enum: [website_form, webhook, meta_leadgen, manual] }
                name: { type: string, maxLength: 100, example: 'Zapier: Zameen.com' }
                source_label:
                  type: string
                  pattern: '^[a-z0-9_-]{1,40}$'
                  description: Stored as contacts.source and used by "by source" assignment. Defaults per type (website, webhook, facebook, manual).
                mapping: { $ref: '#/components/schemas/LeadMapping' }
                settings: { $ref: '#/components/schemas/LeadSourceSettings' }
                meta: { $ref: '#/components/schemas/MetaConnection' }
      responses:
        '422': { description: 'validation_failed, or meta_subscribe_failed (Meta rejected the page token)' }
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/LeadSource'
                      - type: object
                        properties: { secret: { type: string, example: whsec_... } }

  /lead-sources/{id}:
    patch:
      tags: [Lead capture]
      summary: Update or rotate a lead source (managers)
      description: '`settings` is merged into the stored settings (server-managed keys such as the Meta page stay).'
      parameters: [{ $ref: '#/components/parameters/Workspace' }, { $ref: '#/components/parameters/Id' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                source_label: { type: string }
                mapping: { $ref: '#/components/schemas/LeadMapping' }
                settings: { $ref: '#/components/schemas/LeadSourceSettings' }
                is_active: { type: boolean }
                rotate_secret: { type: boolean, enum: [true], description: Webhook sources only. Returns the new `secret`. }
                meta:
                  description: meta_leadgen only. Refresh an expired page token and/or change the forms.
                  allOf: [{ $ref: '#/components/schemas/MetaConnection' }]
      responses:
        '200': { description: 'Updated source (with `secret` if rotated)' }
        '404': { $ref: '#/components/responses/Error' }

  /hooks/leads/{key}:
    post:
      tags: [Lead capture]
      summary: Receive a lead (public)
      security: []
      description: |
        `key` is the source's `public_key`.

        * **website_form**: called from the browser (`/embed/lead-form.js`) or a plain HTML form
          (`application/x-www-form-urlencoded`, then a 303 redirect to `settings.redirect_url` when set).
          Checked against `settings.allowed_origins`, a honeypot field and rate limits (60/min per
          source, 10/min per IP).
        * **webhook**: server-to-server (Zapier, Make, n8n, partner sites). Send either
          `X-Signature: sha256=<hex HMAC-SHA256 of the raw body with the secret>` or
          `X-Webhook-Secret: <secret>`. Limit 300/min per source.

        Fields are read via the source's mapping, falling back to common names (name, full_name,
        phone, mobile, cell, email, message...). Meta-style `field_data` arrays are understood.
        A known phone does not create a new contact: it is logged as a re-enquiry and routed as a
        fresh lead. The raw payload is kept 30 days in `lead_events`.
      parameters:
        - { name: key, in: path, required: true, schema: { type: string, example: ls_abc123 } }
        - { name: X-Signature, in: header, schema: { type: string } }
        - { name: X-Webhook-Secret, in: header, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true, example: { name: Ahmed Khan, phone: 0300-1234567, message: Interested in DHA Phase 6 } }
          application/x-www-form-urlencoded:
            schema: { type: object, additionalProperties: true }
      responses:
        '201':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  status: { type: string, enum: [created, reenquiry, accepted] }
                  contact_id: { type: [string, 'null'], format: uuid }
        '303': { description: 'Redirect for plain HTML form posts' }
        '401': { description: 'Bad or missing signature' }
        '403': { description: 'Origin not allowed' }
        '404': { description: 'Unknown or inactive source' }
        '422': { description: 'No usable phone or email (codes: invalid_phone, missing_contact_details)' }
        '429': { description: 'Rate limited' }
    options:
      tags: [Lead capture]
      summary: CORS preflight for website forms
      security: []
      parameters: [{ name: key, in: path, required: true, schema: { type: string } }]
      responses: { '204': { description: 'CORS headers when the Origin is allowed' } }

  /leads/quick-add:
    post:
      tags: [Lead capture]
      summary: Quick-add a lead, optionally with a voice note
      description: |
        Send JSON, or `multipart/form-data` with the same fields plus a `voice` audio file (≤10 MB).
        A duplicate phone returns 200 with `status: reenquiry` and does not change the owner;
        `contact` is null if the caller can't see it (owned by a colleague).
      parameters: [{ $ref: '#/components/parameters/Workspace' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuickAdd' }
          multipart/form-data:
            schema:
              allOf:
                - $ref: '#/components/schemas/QuickAdd'
                - type: object
                  properties:
                    voice: { type: string, format: binary }
                    tags: { type: string, description: Comma-separated }
      responses:
        '201': { $ref: '#/components/responses/QuickAddResult' }
        '200': { $ref: '#/components/responses/QuickAddResult' }
        '403': { description: 'An agent tried to assign to someone else' }

  /assignment-rules:
    get:
      tags: [Assignment]
      summary: Current assignment rules and team availability
      parameters: [{ $ref: '#/components/parameters/Workspace' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: '#/components/schemas/AssignmentRules' } }
    put:
      tags: [Assignment]
      summary: Replace assignment rules (managers)
      parameters: [{ $ref: '#/components/parameters/Workspace' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignmentRulesInput' }
      responses:
        '200': { description: 'Saved rules (same shape as GET)' }
        '422': { description: 'validation_failed, or invalid_members (details.user_ids)' }

  /availability:
    put:
      tags: [Assignment]
      summary: Mark yourself (or, as a manager, someone) available or unavailable
      description: Unavailable people are skipped by round-robin, by-source and auto-reassign.
      parameters: [{ $ref: '#/components/parameters/Workspace' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [available]
              properties:
                available: { type: boolean }
                user_id: { type: string, format: uuid, description: Managers only; defaults to the caller }
      responses:
        '200': { description: 'OK' }
        '403': { description: 'Agent tried to change someone else' }

  /contacts/{id}/assign:
    post:
      tags: [Assignment]
      summary: Assign or unassign a contact by hand (managers)
      parameters: [{ $ref: '#/components/parameters/Workspace' }, { $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties: { user_id: { type: [string, 'null'], format: uuid } }
      responses:
        '200':
          description: Writes an `assignment` activity and notifies the new owner.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      contact_id: { type: string, format: uuid }
                      owner_id: { type: [string, 'null'], format: uuid }
                      changed: { type: boolean }

  /tasks:
    get:
      tags: [Tasks]
      summary: List tasks
      description: |
        Ordered by due time. `due` buckets don't overlap: overdue = before now; today = now until
        midnight (workspace time); upcoming = after today. `due` implies `status=open`.
        Agents always get only their own tasks.
      parameters:
        - $ref: '#/components/parameters/Workspace'
        - { name: assigned_to, in: query, schema: { type: string, description: "'me', 'all' or a user id" } }
        - { name: status, in: query, schema: { type: string, enum: [open, done, cancelled, all], default: open } }
        - { name: due, in: query, schema: { type: string, enum: [today, overdue, upcoming] } }
        - { name: contact_id, in: query, schema: { type: string, format: uuid } }
        - { name: deal_id, in: query, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/TaskWithContact' } }
                  next_cursor: { type: [string, 'null'] }
    post:
      tags: [Tasks]
      summary: Create a task
      description: Title defaults from the type and contact ("Call Ahmed"). Agents can only assign to themselves.
      parameters: [{ $ref: '#/components/parameters/Workspace' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, due_at]
              properties:
                contact_id: { type: [string, 'null'], format: uuid }
                deal_id: { type: [string, 'null'], format: uuid }
                assigned_to: { type: string, format: uuid }
                type: { $ref: '#/components/schemas/TaskType' }
                title: { type: string, maxLength: 200 }
                notes: { type: string }
                due_at: { type: string, format: date-time }
      responses:
        '201': { description: Created, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Task' } } } } } }
        '404': { description: 'contact_not_found (or not visible to the caller)' }

  /tasks/{id}:
    patch:
      tags: [Tasks]
      summary: Edit, reschedule, reassign (managers) or cancel a task
      parameters: [{ $ref: '#/components/parameters/Workspace' }, { $ref: '#/components/parameters/Id' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                notes: { type: [string, 'null'] }
                type: { $ref: '#/components/schemas/TaskType' }
                due_at: { type: string, format: date-time, description: Rescheduling re-arms the reminder }
                assigned_to: { type: string, format: uuid }
                status: { type: string, enum: [open, cancelled] }
      responses:
        '200': { description: 'Updated task' }
        '409': { description: 'Completed tasks can''t be reopened' }

  /tasks/{id}/complete:
    post:
      tags: [Tasks]
      summary: Complete a task, optionally creating the next follow-up
      description: Completing a call / WhatsApp / meeting / site visit counts as a response for speed-to-lead.
      parameters: [{ $ref: '#/components/parameters/Workspace' }, { $ref: '#/components/parameters/Id' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                outcome: { type: string, maxLength: 100, example: interested }
                note: { type: string }
                next: { $ref: '#/components/schemas/FollowUp' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      task: { $ref: '#/components/schemas/Task' }
                      next: { oneOf: [{ $ref: '#/components/schemas/Task' }, { type: 'null' }] }
        '409': { description: 'task_not_open' }

  /notifications:
    get:
      tags: [Notifications]
      summary: The caller's notifications, newest first
      parameters:
        - $ref: '#/components/parameters/Workspace'
        - { name: unread, in: query, schema: { type: string, enum: ['true', 'false'] } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Notification' } }
                  unread_count: { type: integer }
                  next_cursor: { type: [string, 'null'] }

  /notifications/read:
    post:
      tags: [Notifications]
      summary: Mark notifications read
      parameters: [{ $ref: '#/components/parameters/Workspace' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - { type: object, required: [ids], properties: { ids: { type: array, items: { type: string, format: uuid } } } }
                - { type: object, required: [all], properties: { all: { type: boolean, enum: [true] } } }
      responses:
        '200': { description: '{ data: { marked_read: n } }' }

  /home/summary:
    get:
      tags: [Home]
      summary: Everything the home screen needs in one call
      parameters:
        - $ref: '#/components/parameters/Workspace'
        - { name: scope, in: query, schema: { type: string, enum: [me, team], default: me }, description: team is managers only }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HomeSummary' }

  /billing/plans:
    get:
      tags: [Billing]
      summary: Plans and prices (per client workspace, PKR)
      parameters: [{ $ref: '#/components/parameters/Workspace' }]
      responses:
        '200': { description: 'OK' }

  /hooks/meta/leadgen:
    get:
      tags: [Lead capture]
      summary: Meta webhook verification (public)
      security: []
      parameters:
        - { name: hub.mode, in: query, schema: { type: string, enum: [subscribe] } }
        - { name: hub.verify_token, in: query, schema: { type: string }, description: Must equal META_VERIFY_TOKEN }
        - { name: hub.challenge, in: query, schema: { type: string } }
      responses:
        '200': { description: 'The challenge, as text/plain' }
        '403': { description: 'Wrong verify token' }
    post:
      tags: [Lead capture]
      summary: Meta lead ads deliveries (public, signed)
      security: []
      description: |
        One URL for the whole platform (Meta app → Webhooks → Page → `leadgen`). Signed with the app
        secret (`X-Hub-Signature-256`). Each `leadgen` change is matched to the active `meta_leadgen`
        source for that page (a source limited to the form wins over a page-wide one), stored in
        `lead_events`, and fetched from the Graph API by the worker, then ingested like any lead.
        Repeated deliveries of the same lead are ignored.
      parameters:
        - { name: X-Hub-Signature-256, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              example: { object: page, entry: [{ id: '104857600001', changes: [{ field: leadgen, value: { leadgen_id: '900001', page_id: '104857600001', form_id: '700000000001' } }] }] }
      responses:
        '200':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  queued: { type: integer }
                  duplicate: { type: integer }
                  no_source: { type: integer }
        '401': { description: 'Bad signature' }

  /notification-settings:
    get:
      tags: [Notifications]
      summary: The caller's channels per event type
      description: In-app is always on. Defaults send WhatsApp only for urgent items. Quiet hours (23:00-08:00 workspace time) hold push and WhatsApp until 08:00.
      parameters: [{ $ref: '#/components/parameters/Workspace' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: '#/components/schemas/NotificationSettings' } }
    put:
      tags: [Notifications]
      summary: Update the caller's settings (partial)
      description: Allowed even when the workspace is read-only.
      parameters: [{ $ref: '#/components/parameters/Workspace' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                events:
                  type: array
                  items:
                    type: object
                    required: [type]
                    properties:
                      type: { $ref: '#/components/schemas/NotificationType' }
                      push: { type: boolean }
                      whatsapp: { type: boolean }
                quiet_hours: { type: boolean }
                whatsapp_number: { type: [string, 'null'], description: For agent alerts; null = profile phone }
      responses:
        '200': { description: 'Updated settings (same shape as GET)' }
        '422': { description: 'invalid_phone' }

  /push-subscriptions:
    post:
      tags: [Notifications]
      summary: Register this browser for web push
      description: Send `registration.pushManager.subscribe(...).toJSON()`. Use `push.vapid_public_key` from GET /notification-settings as the applicationServerKey. The service worker should `importScripts('/push-sw.js')`.
      parameters: [{ $ref: '#/components/parameters/Workspace' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint, keys]
              properties:
                endpoint: { type: string, format: uri }
                keys: { type: object, required: [p256dh, auth], properties: { p256dh: { type: string }, auth: { type: string } } }
      responses:
        '201': { description: '{ data: { id } }' }
    delete:
      tags: [Notifications]
      summary: Forget this browser (call on logout)
      parameters: [{ $ref: '#/components/parameters/Workspace' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [endpoint], properties: { endpoint: { type: string, format: uri } } }
      responses:
        '200': { description: '{ data: { removed } }' }

  /automations:
    get:
      tags: [Automations]
      summary: The six preset rules with state, settings and recent runs
      parameters: [{ $ref: '#/components/parameters/Workspace' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { data: { type: array, items: { $ref: '#/components/schemas/Automation' } } }

  /automations/{key}:
    patch:
      tags: [Automations]
      summary: Switch a rule on/off and/or change its settings (managers)
      description: Settings are merged and validated against the rule's `settings_schema`.
      parameters:
        - $ref: '#/components/parameters/Workspace'
        - { name: key, in: path, required: true, schema: { $ref: '#/components/schemas/AutomationKey' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
                settings: { type: object, additionalProperties: true }
      responses:
        '200': { description: '{ data: { key, enabled, settings } }' }
        '404': { description: 'Unknown automation' }
        '422': { description: 'validation_failed, or incomplete_settings (e.g. welcome message without a template)' }

  /automation-runs:
    get:
      tags: [Automations]
      summary: Run log, newest first (managers) — "why did this message go out?"
      parameters:
        - $ref: '#/components/parameters/Workspace'
        - { name: automation_key, in: query, schema: { $ref: '#/components/schemas/AutomationKey' } }
        - { name: status, in: query, schema: { type: string, enum: [success, skipped, failed] } }
        - { name: contact_id, in: query, schema: { type: string, format: uuid } }
        - { name: deal_id, in: query, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        automation_key: { $ref: '#/components/schemas/AutomationKey' }
                        trigger_event: { type: string, example: lead.received }
                        contact_id: { type: [string, 'null'] }
                        contact_name: { type: [string, 'null'] }
                        deal_id: { type: [string, 'null'] }
                        status: { type: string, enum: [success, skipped, failed] }
                        result: { type: object, description: 'e.g. { task_id }, { message_id }, { reason }' }
                        error: { type: [string, 'null'] }
                        created_at: { type: string, format: date-time }
                  next_cursor: { type: [string, 'null'] }

  /reports/sources:
    get:
      tags: [Reports]
      summary: Leads by source and by day (new + re-enquiries)
      parameters: &reportParams
        - $ref: '#/components/parameters/Workspace'
        - { name: from, in: query, schema: { type: string, format: date }, description: 'Workspace-local date, inclusive; default 29 days before `to`' }
        - { name: to, in: query, schema: { type: string, format: date }, description: 'Workspace-local date, inclusive; default today' }
        - { name: pipeline_id, in: query, schema: { type: string, format: uuid } }
        - { name: source, in: query, schema: { type: string } }
        - { name: agent_id, in: query, schema: { type: string, format: uuid }, description: Ignored for agents (always themselves) }
      responses:
        '200': { description: '{ data: <report>, filters }' }
        '422': { description: 'Invalid filters' }

  /reports/speed-to-lead:
    get:
      tags: [Reports]
      summary: Median / p90 time from lead creation to first response, per agent
      parameters: *reportParams
      responses:
        '200': { description: '{ data: <report>, filters }' }
        '422': { description: 'Invalid filters' }

  /reports/funnel:
    get:
      tags: [Reports]
      summary: 'Funnel for one pipeline (default: first) over deals created in range, with win rate'
      parameters: *reportParams
      responses:
        '200': { description: '{ data: <report>, filters }' }
        '422': { description: 'Invalid filters' }

  /reports/agents:
    get:
      tags: [Reports]
      summary: 'Per agent: assigned, contacted, follow-ups done, overdue now, deals won'
      parameters: *reportParams
      responses:
        '200': { description: '{ data: <report>, filters }' }
        '422': { description: 'Invalid filters' }

  /reports/won-value:
    get:
      tags: [Reports]
      summary: Won deal value (PKR) by month
      parameters: *reportParams
      responses:
        '200': { description: '{ data: <report>, filters }' }
        '422': { description: 'Invalid filters' }

  /reports/lost-reasons:
    get:
      tags: [Reports]
      summary: Lost deals by reason, count and value
      parameters: *reportParams
      responses:
        '200': { description: '{ data: <report>, filters }' }
        '422': { description: 'Invalid filters' }

  /billing/subscription:
    get:
      tags: [Billing]
      summary: Current subscription, trial, pending plan change, workspaces and amount due
      security: [{ bearer: [] }]
      parameters: [{ $ref: '#/components/parameters/Partner' }, { $ref: '#/components/parameters/DirectWorkspace' }]
      responses:
        '200': { description: '{ data: { subscription, plan, pending_plan, pending_plan_effective, trial, workspaces, outstanding_pkr, overdue_invoices } }' }
        '403': { description: 'not_partner_admin, forbidden (not the owner), billed_by_partner' }
    post:
      tags: [Billing]
      summary: Start a subscription, or change plan
      description: |
        No subscription yet: starts one. With an `identity` (NTN, CNIC or owner phone) never used
        before, the first month is free for up to 5 workspaces (extras billed); otherwise the
        first invoice is issued now. Existing subscription: plan change, applied at the end of the
        paid period (immediately during the trial). An account archived for non-payment gets
        `409 pay_outstanding`.
      parameters: [{ $ref: '#/components/parameters/Partner' }, { $ref: '#/components/parameters/DirectWorkspace' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan_id]
              properties:
                plan_id: { type: string, enum: [commission, monthly, quarterly, annual] }
                identity: { type: string, example: '1234567-8' }
      responses:
        '201': { description: 'Started: { data, trial, invoice_id }' }
        '200': { description: 'Plan changed: { data, changed: true }' }
        '409': { description: 'pay_outstanding, subscription_inactive' }

  /billing/invoices:
    get:
      tags: [Billing]
      summary: Latest 36 invoices with lines and payments
      parameters: [{ $ref: '#/components/parameters/Partner' }, { $ref: '#/components/parameters/DirectWorkspace' }]
      responses:
        '200': { description: '{ data: [{ id, number, period_start, issue_date, due_date, status, total_pkr, paid_pkr, lines[], payments[] }] }' }

  /billing/payments:
    get:
      tags: [Billing]
      summary: Payments reported by this account
      parameters: [{ $ref: '#/components/parameters/Partner' }, { $ref: '#/components/parameters/DirectWorkspace' }]
      responses:
        '200': { description: 'OK' }
    post:
      tags: [Billing]
      summary: Report a payment with the transfer screenshot
      description: A super-admin confirms it; once confirmed payments cover the invoice it is paid and access is restored.
      parameters: [{ $ref: '#/components/parameters/Partner' }, { $ref: '#/components/parameters/DirectWorkspace' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [invoice_id, amount_pkr, method, proof]
              properties:
                invoice_id: { type: string, format: uuid }
                amount_pkr: { type: number }
                method: { type: string, enum: [bank_transfer, jazzcash, easypaisa, card] }
                reference: { type: string }
                proof: { type: string, format: binary, description: 'JPG, PNG, WebP, HEIC or PDF, up to 5 MB' }
      responses:
        '201': { description: 'Pending payment' }
        '409': { description: 'invoice_closed' }
        '422': { description: 'proof_required, invalid_proof' }

  /billing/commission-statement:
    get:
      tags: [Billing]
      summary: Commission plan statement for a month (default last month)
      parameters:
        - $ref: '#/components/parameters/Partner'
        - { name: month, in: query, schema: { type: string, pattern: '^\d{4}-\d{2}$' } }
      responses:
        '200': { description: '{ data: { month, applies, rate, monthly_minimum_pkr, workspaces: [{ workspace_id, workspace_name, amount_collected_pkr, commission_pkr, floor_applied, status }], totals } }' }

  /billing/collections:
    put:
      tags: [Billing]
      summary: Report what was collected from each client in a month (commission plan)
      description: Allowed for past or current months until that month is invoiced.
      parameters: [{ $ref: '#/components/parameters/Partner' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [month, items]
              properties:
                month: { type: string, example: '2026-11' }
                items:
                  type: array
                  items:
                    type: object
                    required: [workspace_id, amount_collected_pkr]
                    properties:
                      workspace_id: { type: string, format: uuid }
                      amount_collected_pkr: { type: number, minimum: 0 }
      responses:
        '200': { description: '{ data: { month, reported } }' }
        '409': { description: 'not_commission_plan, already_invoiced' }
        '422': { description: 'future_month, invalid_workspaces' }

  /admin/partners:
    get:
      tags: [Admin]
      summary: All partners with subscriptions, workspaces, outstanding balance (super-admins)
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [trialing, active, read_only, archived, suspended, cancelled, none] } }
        - { name: q, in: query, schema: { type: string }, description: Name contains }
      responses:
        '200': { description: 'OK' }
        '403': { description: 'not_platform_admin' }

  /admin/partners/{id}/suspend:
    post:
      tags: [Admin]
      summary: Suspend or lift a partner (all its workspaces; reads blocked too)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [suspended], properties: { suspended: { type: boolean }, reason: { type: string } } }
      responses:
        '200': { description: '{ data: { partner_id, suspended, workspaces } }' }
        '422': { description: 'house_partner (use /admin/workspaces/{id}/suspend)' }

  /admin/workspaces/{id}/suspend:
    post:
      tags: [Admin]
      summary: Suspend or lift one workspace (e.g. a direct customer)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [suspended], properties: { suspended: { type: boolean }, reason: { type: string } } }
      responses:
        '200': { description: '{ data: { workspace_id, suspended, changed } }' }

  /admin/payments:
    get:
      tags: [Admin]
      summary: Payment confirmation queue with 15-minute proof download links
      parameters: [{ name: status, in: query, schema: { type: string, enum: [pending, confirmed, rejected], default: pending } }]
      responses:
        '200': { description: 'OK' }

  /admin/payments/{id}/confirm:
    post:
      tags: [Admin]
      summary: Confirm (or reject with approve=false) a payment
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { approve: { type: boolean, default: true }, notes: { type: string } } }
      responses:
        '200': { description: '{ data: { payment_id, status, invoice_paid, access_restored } }' }
        '409': { description: 'already_reviewed' }

  /admin/trials/{id}/extend:
    post:
      tags: [Admin]
      summary: Add days to a subscription's free trial (id = subscription id)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [days], properties: { days: { type: integer, minimum: 1, maximum: 90 } } }
      responses:
        '200': { description: '{ data: { subscription_id, trial_ends_at } }' }
        '409': { description: 'not_trialing' }

  /admin/billing/run:
    post:
      tags: [Admin]
      summary: Run the monthly billing now (safe to repeat), then the read-only/archive rules
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { month: { type: string, example: '2026-12' } } }
      responses:
        '200': { description: '{ data: { month, invoices, nothing_due, failed, total_pkr, enforcement } }' }

components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT, description: Supabase Auth access token }
  parameters:
    Workspace: { name: X-Workspace-Id, in: header, required: true, schema: { type: string, format: uuid } }
    Id: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
    Cursor: { name: cursor, in: query, schema: { type: string } }
    Partner: { name: X-Partner-Id, in: header, schema: { type: string, format: uuid }, description: 'Partner admins: bill all of the partner''s client workspaces' }
    DirectWorkspace: { name: X-Workspace-Id, in: header, schema: { type: string, format: uuid }, description: 'Direct customers (house partner): the owner bills their own workspace' }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties: { code: { type: string }, message: { type: string }, details: {} }
    QuickAddResult:
      description: Created (201) or re-enquiry (200)
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  contact_id: { type: string, format: uuid }
                  status: { type: string, enum: [created, reenquiry] }
                  owner_id: { type: [string, 'null'], format: uuid }
                  voice_note_path: { type: [string, 'null'], example: voice-notes/<ws>/<contact>/<uuid>.webm }
                  contact:
                    oneOf:
                      - type: object
                        properties:
                          id: { type: string }
                          name: { type: [string, 'null'] }
                          phone_e164: { type: string }
                          owner_id: { type: [string, 'null'] }
                          source: { type: string }
                      - type: 'null'
  schemas:
    MetaConnection:
      type: object
      required: [page_id, page_access_token]
      description: From Facebook Login on the frontend. The token is stored encrypted and never returned.
      properties:
        page_id: { type: string, example: '104857600001' }
        page_access_token: { type: string, writeOnly: true }
        form_ids: { type: array, items: { type: string }, description: Only these lead forms; empty = all forms on the page }
    NotificationType:
      type: string
      enum: [lead.assigned, lead.reenquired, lead.untouched, lead.unassigned, lead.reassigned_away, task.assigned,
             task.reminder, task.overdue, digest.overdue, deal.stale, deal.won, billing.read_only, billing.archived]
    NotificationSettings:
      type: object
      properties:
        events:
          type: array
          items:
            type: object
            properties:
              type: { $ref: '#/components/schemas/NotificationType' }
              label: { type: string }
              in_app: { type: boolean, enum: [true] }
              push: { type: boolean }
              whatsapp: { type: boolean }
        quiet_hours: { type: boolean }
        quiet_hours_window: { type: string, example: '23:00-08:00' }
        whatsapp_number: { type: [string, 'null'] }
        whatsapp_number_effective: { type: [string, 'null'] }
        push: { type: object, properties: { vapid_public_key: { type: [string, 'null'] }, devices: { type: integer } } }
    AutomationKey:
      type: string
      enum: [welcome_message, auto_follow_up, no_answer_retry, stage_follow_up, stale_deal_alert, won_notice]
    Automation:
      type: object
      properties:
        key: { $ref: '#/components/schemas/AutomationKey' }
        name: { type: string }
        description: { type: string }
        triggers: { type: array, items: { type: string }, example: [lead.received] }
        enabled: { type: boolean }
        settings: { type: object, description: Current settings with defaults applied }
        settings_schema: { type: object, description: JSON Schema to render the settings form }
        last_run_at: { type: [string, 'null'], format: date-time }
        runs_7d: { type: integer }
        failed_7d: { type: integer }
    PathOrPaths:
      oneOf: [{ type: string }, { type: array, items: { type: string }, maxItems: 10 }]
      description: Dot path into the payload (case-insensitive), or a list tried in order.
    LeadMapping:
      type: object
      additionalProperties: false
      properties:
        name: { $ref: '#/components/schemas/PathOrPaths' }
        first_name: { $ref: '#/components/schemas/PathOrPaths' }
        last_name: { $ref: '#/components/schemas/PathOrPaths' }
        phone: { $ref: '#/components/schemas/PathOrPaths' }
        email: { $ref: '#/components/schemas/PathOrPaths' }
        notes: { $ref: '#/components/schemas/PathOrPaths' }
        custom:
          type: object
          description: custom_field key → path
          additionalProperties: { $ref: '#/components/schemas/PathOrPaths' }
        tags: { type: array, items: { type: string } }
      example: { name: full_name, phone: [phone, contact.mobile], custom: { budget: budget_pkr }, tags: [ppc] }
    LeadSourceSettings:
      type: object
      additionalProperties: false
      properties:
        allowed_origins: { type: array, items: { type: string, format: uri }, description: 'website_form: empty = any site' }
        redirect_url: { type: string, format: uri }
        default_tags: { type: array, items: { type: string } }
    LeadSource:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [website_form, webhook, meta_leadgen, whatsapp, manual, import] }
        name: { type: string }
        source_label: { type: string }
        public_key: { type: string }
        mapping: { $ref: '#/components/schemas/LeadMapping' }
        settings: { $ref: '#/components/schemas/LeadSourceSettings' }
        is_active: { type: boolean }
        endpoint_url: { type: [string, 'null'], description: URL to give Zapier / the website }
        embed_snippet: { type: [string, 'null'], description: HTML to paste into the website (website_form) }
        created_at: { type: string, format: date-time }
    QuickAdd:
      type: object
      required: [phone]
      properties:
        name: { type: string }
        phone: { type: string, example: 0300-1234567 }
        email: { type: string, format: email }
        note: { type: string }
        assign_to: { type: string, description: "'me' (default), 'auto' (rules; managers) or a user id (managers)" }
        source_label: { type: string, default: manual }
        tags: { type: array, items: { type: string } }
    AssignmentRulesInput:
      type: object
      required: [mode]
      properties:
        mode: { type: string, enum: [manual, round_robin, by_source] }
        agent_ids: { type: array, items: { type: string, format: uuid }, description: Rotation pool, in order }
        source_map:
          type: object
          description: source_label or lead_source_id → users (several rotate)
          additionalProperties: { type: array, items: { type: string, format: uuid } }
          example: { facebook: [ali-uuid], website: [sara-uuid, bilal-uuid] }
        fallback: { type: string, enum: [round_robin, unassigned], default: round_robin }
        reassign_after_minutes: { type: [integer, 'null'], minimum: 5, maximum: 1440, description: null = off (default) }
        max_auto_reassigns: { type: integer, minimum: 1, maximum: 10, default: 2 }
    AssignmentRules:
      allOf:
        - $ref: '#/components/schemas/AssignmentRulesInput'
        - type: object
          properties:
            members:
              type: array
              items:
                type: object
                properties:
                  user_id: { type: string, format: uuid }
                  name: { type: [string, 'null'] }
                  role: { type: string, enum: [owner, manager, agent] }
                  available: { type: boolean }
    TaskType: { type: string, enum: [call, whatsapp, meeting, site_visit, other] }
    FollowUp:
      type: object
      required: [due_at]
      properties:
        type: { $ref: '#/components/schemas/TaskType' }
        due_at: { type: string, format: date-time }
        title: { type: string }
        notes: { type: string }
        assigned_to: { type: string, format: uuid }
    Task:
      type: object
      properties:
        id: { type: string, format: uuid }
        contact_id: { type: [string, 'null'], format: uuid }
        deal_id: { type: [string, 'null'], format: uuid }
        assigned_to: { type: string, format: uuid }
        created_by: { type: [string, 'null'], format: uuid }
        type: { $ref: '#/components/schemas/TaskType' }
        title: { type: string }
        notes: { type: [string, 'null'] }
        due_at: { type: string, format: date-time }
        status: { type: string, enum: [open, done, cancelled] }
        completed_at: { type: [string, 'null'], format: date-time }
        outcome: { type: [string, 'null'] }
        origin: { type: string, enum: [manual, call_outcome, task_completion, automation] }
        parent_task_id: { type: [string, 'null'], format: uuid }
    TaskWithContact:
      allOf:
        - $ref: '#/components/schemas/Task'
        - type: object
          properties:
            is_overdue: { type: boolean }
            contact:
              oneOf:
                - type: object
                  properties: { id: { type: string }, name: { type: [string, 'null'] }, phone_e164: { type: [string, 'null'] } }
                - type: 'null'
    Notification:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/NotificationType' }
        priority: { type: string, enum: [normal, urgent] }
        title: { type: string }
        body: { type: [string, 'null'] }
        data: { type: object, description: 'Deep-link ids: contact_id, task_id, ...' }
        read_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
    HomeSummary:
      type: object
      properties:
        data:
          type: object
          properties:
            scope: { type: string, enum: [me, team] }
            timezone: { type: string, example: Asia/Karachi }
            me: { type: object, properties: { user_id: { type: string }, role: { type: string }, available: { type: boolean } } }
            tasks:
              type: object
              properties:
                overdue: { type: integer }
                due_today: { type: integer }
                upcoming: { type: integer }
                next: { type: array, description: Up to 10 overdue + due-today tasks, oldest first, items: { type: object } }
            leads:
              type: object
              properties:
                new_today: { type: integer }
                awaiting_first_response: { type: integer }
                unassigned: { type: [integer, 'null'], description: null for agents }
                recent: { type: array, maxItems: 5, items: { type: object } }
            speed_to_lead_today:
              type: object
              properties:
                median_seconds: { type: [integer, 'null'] }
                responded: { type: integer }
            notifications: { type: object, properties: { unread: { type: integer } } }
